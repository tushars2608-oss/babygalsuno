
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffe3ef">
  <title>Meri Baby ❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px 0;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Segoe UI", Arial, sans-serif;
      text-align: center;
      color: #713d60;
      background: linear-gradient(135deg, #ffe0ec, #f5e5ff, #fff0f5);
      overflow-x: hidden;
    }

    #app {
      width: min(92%, 480px);
      padding: 30px 22px;
      margin: auto;
      position: relative;
      z-index: 2;
      border: 1px solid white;
      border-radius: 28px;
      background: rgba(255, 255, 255, .92);
      box-shadow: 0 18px 60px rgba(184, 100, 150, .2);
      animation: appear .4s ease;
    }

    .hero-heart {
      font-size: 68px;
      animation: heartbeat 1.4s ease-in-out infinite;
    }

    h1 {
      color: #e75480;
      font-size: clamp(26px, 7vw, 35px);
      line-height: 1.3;
      margin: 15px 0;
    }

    h2 {
      color: #e75480;
      font-size: 23px;
    }

    p {
      font-size: 17px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .subtitle {
      color: #96617f;
    }

    button {
      width: 100%;
      padding: 15px 12px;
      margin: 10px 0;
      border: none;
      border-radius: 16px;
      color: white;
      background: linear-gradient(105deg, #ff82ad, #d8a4ff);
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 7px 18px rgba(213, 140, 182, .22);
      transition: transform .2s ease;
    }

    button:hover {
      transform: translateY(-2px);
    }

    button:disabled {
      opacity: .65;
      cursor: wait;
      transform: none;
    }

    button.secondary {
      color: #a34e80;
      background: #fff0f7;
      border: 1px solid #f4c5dc;
      box-shadow: none;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 115px;
      margin: 18px 0 10px;
      padding: 14px;
      border: 2px solid #f2c8df;
      border-radius: 15px;
      background: #fffafd;
      color: #713d60;
      font: inherit;
      resize: vertical;
    }

    .small {
      color: #a87596;
      font-size: 12px;
    }

    #message {
      margin-top: 15px;
      overflow-wrap: anywhere;
    }

    footer {
      margin-top: 24px;
      color: #a87596;
      font-size: 12px;
    }

    .float-heart {
      position: fixed;
      bottom: -45px;
      pointer-events: none;
      z-index: 1;
      opacity: .65;
      animation: float-up 8s linear forwards;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes float-up {
      to {
        transform: translateY(-115vh) rotate(25deg);
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>

  <main id="app" aria-live="polite"></main>

  <script>
    // Formspree email form
    const FORMSPREE_URL = "https://formspree.io/f/xbggynkg";

    // Countdown date
    const DELIVERY_DATE = "2026-11-29T00:00:00";

    const app = document.getElementById("app");

    let countdownInterval = null;
    let submitting = false;

    function render(content) {
      if (countdownInterval) {
        clearInterval(countdownInterval);
        countdownInterval = null;
      }

      app.innerHTML = content +
        '<footer>Made with all my love, for my Baby ❤️</footer>';

      app.style.animation = "none";
      void app.offsetWidth;
      app.style.animation = "appear .4s ease";
    }

    function button(label, action, secondary = false) {
      return `
        <button type="button"
          class="${secondary ? "secondary" : ""}"
          onclick="${action}">
          ${label}
        </button>
      `;
    }

    function backButton() {
      return button("← वापस चलें, Baby ❤️", "home()", true);
    }

    // Send every selection to Formspree
    async function sendToEmail(option, extraMessage = "") {
      if (submitting) return;

      submitting = true;

      const status = document.getElementById("message");
      const buttons = app.querySelectorAll("button");

      buttons.forEach(b => b.disabled = true);

      if (status) {
        status.textContent = "आपका message भेज रहे हैं, Baby... 💌";
      }

      const formData = new FormData();

      formData.append("option_selected", option);
      formData.append("message", extraMessage || option);
      formData.append("_subject", "Meri Baby ❤️ - New Website Response");
      formData.append("website", "Meri Baby ❤️");

      try {
        const response = await fetch(FORMSPREE_URL, {
          method: "POST",
          body: formData,
          headers: {
            "Accept": "application/json"
          }
        });

        if (!response.ok) {
          throw new Error("Submission failed");
        }

        if (status) {
          status.textContent =
            "Message successfully send ho gaya! ❤️🥹";
        }

        return true;

      } catch (error) {
        if (status) {
          status.textContent =
            "Message send nahi ho paya. Internet check karke dobara try karo. ❤️";
        }

        return false;

      } finally {
        submitting = false;
        app.querySelectorAll("button")
          .forEach(b => b.disabled = false);
      }
    }

    // First screen
    function welcome() {
      render(`
        <div class="hero-heart">💗</div>
        <h1>कैसी हो, Baby? 🥹❤️</h1>

        <p class="subtitle">
          आपके लिए कुछ खास बनाया है, मेरी जान। 💕
        </p>

        ${button("अच्छी हूँ 😊", "feeling('good')")}
        ${button("जैसी भी हूँ, आपकी हूँ 🫶", "feeling('yours')")}
      `);
    }

    async function feeling(answer) {
      const choice = answer === "yours"
        ? "जैसी भी हूँ, आपकी हूँ 🫶"
        : "अच्छी हूँ 😊";

      render(`
        <div class="hero-heart">🥹💖</div>
        <h1>${answer === "yours"
          ? "I love you so much, Baby! ❤️"
          : "चलो शुरू करते हैं ❤️"}</h1>

        <p>आपकी smile हमेशा बनी रहे, मेरी जान। 💗</p>
        <div id="message"></div>
        ${button("हाँ जी ❤️", "home()")}
      `);

      // Welcome answer is also emailed
      await sendToEmail(choice);
    }

    // Main menu
    function home() {
      render(`
        <div class="hero-heart">🧸💕</div>

        <h1>मेरी Baby को क्या चाहिए? 🥹</h1>

        <p class="subtitle">
          बताओ ना मेरी जान, आपके लिए सब हाज़िर है ❤️
        </p>

        <div class="button-stack">
          ${button("तुषार चाहिए ❤️", "tushar()")}
          ${button("खाना चाहिए 🍕", "foodDelivery()")}
          ${button("चीज़ी चाहिए 🧀", "cheesy()")}
          ${button("आपको खाना है? 🍽️", "countdown()")}
          ${button("Give me hint 💌", "foodHint()")}
        </div>
      `);
    }

    // Option 1
    async function tushar() {
      render(`
        <div class="hero-heart">🫂💗</div>
        <h1>Baby, मैं तो आपके पास हूँ ❤️</h1>

        <p>बस आँखें बंद करके देखो। 🥹💕</p>
        <p>I love you so much, मेरी Baby! 💖</p>
        <p>ठीक है मेरी Baby? 🫶</p>

        <div id="message"></div>
        ${button("ठीक है मेरी Baby ❤️", "home()")}
      `);

      await sendToEmail("Option 1: तुषार चाहिए ❤️");
    }

    // Option 2
    async function foodDelivery() {
      render(`
        <div class="hero-heart">🍕💗</div>
        <h1>Okay Baby! ❤️</h1>

        <p>Within 60 minutes आपके घर पे आ जाएगा। 🥰</p>
        <p>I love you so much, मेरी जान! 💕</p>

        <div id="message"></div>
        ${backButton()}
      `);

      await sendToEmail("Option 2: खाना चाहिए 🍕");
    }

    // Option 3
    async function cheesy() {
      render(`
        <div class="hero-heart">🧀💖</div>
        <h1>Okay Baby! ❤️</h1>

        <p>आपके घर पे आ जाएगी। 🥹💕</p>
        <p>Love you so much, मेरी Baby! 💗</p>

        <div id="message"></div>
        ${backButton()}
      `);

      await sendToEmail("Option 3: चीज़ी चाहिए 🧀");
    }

    // Option 4: countdown
    async function countdown() {
      render(`
        <div class="hero-heart">🎁💕</div>
        <h1>29 November तक countdown, Baby! 🥹❤️</h1>

        <p>बस इतना-सा इंतज़ार बाकी है 💕</p>
        <h2 id="timer">Countdown शुरू हो रहा है...</h2>
        <p id="timerMessage"></p>
        <div id="message"></div>
        ${backButton()}
      `);

      // Email this selection too
      await sendToEmail("Option 4: आपको खाना है? 🍽️");

      const target = new Date(DELIVERY_DATE).getTime();

      function updateTimer() {
        const timer = document.getElementById("timer");
        const timerMessage = document.getElementById("timerMessage");

        if (!timer || !timerMessage) return false;

        const remaining = target - Date.now();

        if (remaining <= 0) {
          timer.textContent = "वो खास समय आ गया, Baby! ❤️";
          timerMessage.textContent = "I love you so much! 💗";
          return false;
        }

        const days = Math.floor(remaining / 86400000);
        const hours = Math.floor((remaining % 86400000) / 3600000);
        const minutes = Math.floor((remaining % 3600000) / 60000);
        const seconds = Math.floor((remaining % 60000) / 1000);

        timer.textContent =
          `${days} दिन ${hours} घंटे ${minutes} मिनट ${seconds} सेकंड`;

        timerMessage.textContent = "हर पल आपके लिए खास है 💕";
        return true;
      }

      updateTimer();

      countdownInterval = setInterval(() => {
        if (!updateTimer()) {
          clearInterval(countdownInterval);
          countdownInterval = null;
        }
      }, 1000);
    }

    // Option 5: hint form
    function foodHint() {
      render(`
        <div class="hero-heart">💌🥰</div>
        <h1>बताओ Baby, क्या चाहिए? ❤️</h1>

        <p>जो मन में है, यहाँ लिख दो मेरी जान। 💕</p>

        <form id="hintForm">
          <textarea
            id="hint"
            required
            maxlength="500"
            placeholder="यहाँ लिखो, Baby... ❤️"
            aria-label="Your hint"></textarea>

          <button type="submit" id="submitButton">
            Send to Tushar ❤️
          </button>
        </form>

        <div id="message"></div>
        ${backButton()}
      `);

      document.getElementById("hintForm")
        .addEventListener("submit", submitHint);
    }

    async function submitHint(event) {
      event.preventDefault();

      const hint = document.getElementById("hint").value.trim();

      if (!hint) return;

      const sent = await sendToEmail(
        "Option 5: Give me hint 💌",
        hint
      );

      const message = document.getElementById("message");

      if (sent && message) {
        message.textContent =
          "आपका hint Tushar को email कर दिया गया! ❤️🥹";
        document.getElementById("hintForm").reset();
      }
    }

    // Floating hearts
    setInterval(() => {
      if (window.matchMedia(
        "(prefers-reduced-motion: reduce)"
      ).matches) return;

      const heart = document.createElement("div");
      heart.className = "float-heart";
      heart.setAttribute("aria-hidden", "true");

      const hearts = ["💗", "💕", "💖", "💘", "✨"];

      heart.textContent =
        hearts[Math.floor(Math.random() * hearts.length)];

      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = (16 + Math.random() * 22) + "px";

      document.body.appendChild(heart);

      setTimeout(() => heart.remove(), 8000);
    }, 700);

    // Start website
    welcome();
  </script>
</body>
</html>
